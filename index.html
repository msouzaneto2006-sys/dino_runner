<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Runner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5;font-family:Arial,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}#top{width:min(1000px,100%);display:flex;justify-content:space-between;font-weight:bold}#wrap{width:min(1000px,100%);aspect-ratio:3/1;border:2px solid #222;border-radius:10px;overflow:hidden;background:white}canvas{width:100%;height:100%;display:block}#controls{display:flex;gap:10px}button{padding:14px 22px;border:2px solid #222;border-radius:12px;background:#fff;font-weight:bold;font-size:16px}#hint{font-size:13px;color:#666;text-align:center}@media(max-width:700px){#app{padding:6px}#wrap{width:100%;aspect-ratio:4/3}#controls{position:fixed;bottom:12px;left:12px;right:12px;justify-content:center}#jump{width:100%;max-width:380px;padding:18px;font-size:20px}#restart{display:none}#hint{padding-bottom:75px}}</style></head><body><div id="app"><div id="top"><div>🦖 Dino Runner</div><div id="best">RECORDE 00000</div></div><div id="wrap"><canvas id="game" width="1000" height="333"></canvas></div><div id="controls"><button id="jump">PULAR</button><button id="restart">REINICIAR</button></div><div id="hint">PC: Espaço, ↑ ou clique • Celular: toque na tela ou em PULAR</div></div><script>const c=document.getElementById("game"),x=c.getContext("2d"),jb=document.getElementById("jump"),rb=document.getElementById("restart"),be=document.getElementById("best");let d,o,s,v,over,spawn,last,best=Number(localStorage.getItem("dinoBest")||0);function bt(){be.textContent="RECORDE "+String(Math.floor(best)).padStart(5,"0")}function reset(){d={x:95,y:240,w:46,h:52,vy:0,g:1};o=[];s=0;v=390;over=0;spawn=.9;last=performance.now();bt()}function jump(){if(over){reset();return}if(d.g){d.vy=-760;d.g=0}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function upd(dt){if(over)return;s+=dt*12;v+=dt*3.5;d.vy+=2050*dt;d.y+=d.vy*dt;if(d.y>=240){d.y=240;d.vy=0;d.g=1}spawn-=dt;if(spawn<=0){let h=42+Math.random()*28,w=28+Math.random()*18;o.push({x:1030,y:292-h,w,h});spawn=Math.max(.58,.9+Math.random()*.85-(v-390)/2200)}o.forEach(a=>a.x-=v*dt);o=o.filter(a=>a.x+a.w>-20);let dh={x:d.x+7,y:d.y+5,w:d.w-12,h:d.h-8};for(const a of o){if(hit(dh,{x:a.x+3,y:a.y+3,w:a.w-6,h:a.h-5})){over=1;if(s>best){best=s;localStorage.setItem("dinoBest",best);bt()}break}}}function dd(){x.fillStyle="#222";x.fillRect(d.x+10,d.y+14,26,29);x.fillRect(d.x+22,d.y,23,27);x.fillRect(d.x+39,d.y+12,13,11);x.fillRect(d.x+28,d.y+29,17,6);let f=Math.floor(s*2)%2;if(d.g&&f){x.fillRect(d.x+12,d.y+42,7,12);x.fillRect(d.x+29,d.y+42,7,7)}else{x.fillRect(d.x+12,d.y+42,7,7);x.fillRect(d.x+29,d.y+42,7,12)}x.fillStyle="#fff";x.fillRect(d.x+37,d.y+6,4,4)}function draw(){x.clearRect(0,0,1000,333);x.fillStyle="#fff";x.fillRect(0,0,1000,333);x.fillStyle="#ddd";x.fillRect(700,60,80,5);x.fillRect(728,52,30,8);x.fillRect(260,90,70,5);x.fillStyle="#222";x.fillRect(0,292,1000,2);for(let i=0;i<1000;i+=42)x.fillRect(i,302,22,2);dd();for(const a of o){x.fillRect(a.x+9,a.y,a.w-18,a.h);x.fillRect(a.x,a.y+18,9,7);x.fillRect(a.x,a.y+18,7,18)}x.font="bold 20px Arial";x.textAlign="right";x.fillText("SCORE "+String(Math.floor(s)).padStart(5,"0"),970,32);if(over){x.textAlign="center";x.font="bold 38px Arial";x.fillText("GAME OVER",500,135);x.font="18px Arial";x.fillText("Toque, clique ou aperte Espaço para jogar novamente",500,170)}}function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;upd(dt);draw();requestAnimationFrame(loop)}addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});c.addEventListener("pointerdown",e=>{e.preventDefault();jump()});jb.addEventListener("pointerdown",e=>{e.preventDefault();jump()});rb.onclick=reset;reset();requestAnimationFrame(loop)</script></body></html>
