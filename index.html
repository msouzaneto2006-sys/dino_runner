<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Runner Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#eef6ff;overflow:hidden;touch-action:none}
.hidden{display:none!important}
button{font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed;background:#ddd!important}

/* Lobby */
#lobby{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#dff3ff,#fff0ca);
  position:relative;padding:20px
}
.card{
  width:min(600px,94vw);
  background:#fff;border:3px solid #222;border-radius:20px;
  padding:28px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.14)
}
h1{margin:0 0 12px;font-size:38px}
.balance{font-size:30px;font-weight:800;margin:12px 0 22px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mainbtn{
  padding:16px 22px;border:2px solid #222;border-radius:13px;background:#fff;font-size:18px
}
.note{font-size:12px;color:#666;margin-top:15px}
#menuBtn{position:absolute;top:18px;right:18px;width:52px;height:52px;border:2px solid #222;border-radius:13px;background:#fff;font-size:24px}
#menu{position:absolute;right:18px;top:80px;width:260px;background:#fff;border:2px solid #222;border-radius:14px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:10;text-align:left}

/* Game */
#game{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:8px;
  background:linear-gradient(#dff3ff,#fff5d7)
}
#top{
  width:min(1000px,100%);display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-weight:800
}
#roundInfo{text-align:center}
#scoreInfo{text-align:right}
#exitBtn{
  justify-self:start;padding:11px 14px;border:2px solid #222;border-radius:10px;background:#fff
}
#wrap{
  width:min(1000px,100%);aspect-ratio:3/1;
  border:3px solid #222;border-radius:14px;overflow:hidden;background:#fff
}
canvas{display:block;width:100%;height:100%}
#controls{display:flex;gap:10px}
#jumpBtn,#restartBtn{padding:14px 24px;border:2px solid #222;border-radius:12px;background:#fff;font-size:17px}
#hint{font-size:13px;color:#555;text-align:center}

@media(max-width:700px){
  #loginScreen{padding:12px}
  #loginScreen .card{width:100%;max-width:420px}

  #top{grid-template-columns:1fr 1fr;font-size:13px}
  #roundInfo{grid-column:1/3;grid-row:1;text-align:center}
  #exitBtn{grid-column:1;grid-row:2}
  #scoreInfo{grid-column:2;grid-row:2}
  #wrap{width:100%;aspect-ratio:4/3}
  #controls{position:fixed;left:10px;right:10px;bottom:10px;justify-content:center}
  #jumpBtn{width:100%;max-width:380px;padding:18px;font-size:20px}
  #restartBtn{display:none}
  #hint{padding-bottom:75px}
}
</style>
</head>
<body>
<section id="loginScreen">
  <div class="card" style="max-width:420px">
    <h1>🦖 Dino Runner</h1>
    <input id="loginUser" autocomplete="username" autocapitalize="none" placeholder="Usuário"
      style="width:100%;padding:12px;border:2px solid #222;border-radius:9px;margin:5px 0;font-size:16px">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Senha"
      style="width:100%;padding:12px;border:2px solid #222;border-radius:9px;margin:5px 0;font-size:16px">
    <button id="loginEnter" type="button" class="mainbtn" style="width:100%;margin-top:8px">ENTRAR</button>
    <button id="loginCreate" type="button" class="mainbtn" style="width:100%;margin-top:8px">CRIAR CONTA</button>
    <div id="loginMsg" style="font-size:12px;color:#666;margin-top:9px;min-height:18px"></div>
  </div>
</section>

<section id="lobby" class="hidden">
  <button id="menuBtn">☰</button>
  <div id="menu" class="hidden">
        <div style="margin-top:8px">Banca: <strong id="menuBank">R$ 0,00</strong></div>

    <div style="margin-top:10px;font-weight:bold;font-size:13px">Depósito</div>
    <div style="font-size:10px;color:#666;margin:2px 0 5px">Mínimo: R$ 25,00</div>
    <input id="depositValue" type="number" min="25" step="5" placeholder="25,00"
      style="width:100%;padding:7px;border:1px solid #222;border-radius:7px;margin-bottom:5px;font-size:12px">
    <button id="depositBtn" style="width:100%;padding:7px;border:1px solid #222;border-radius:7px;background:#fff;font-size:12px">DEPOSITAR</button>

    <div style="margin-top:10px;font-weight:bold;font-size:13px">Saque</div>
    <div style="font-size:10px;color:#666;margin:2px 0 5px">Mínimo: R$ 50,00</div>
    <input id="withdrawValue" type="number" min="50" step="5" placeholder="50,00"
      style="width:100%;padding:7px;border:1px solid #222;border-radius:7px;margin-bottom:5px;font-size:12px">
    <button id="menuWithdrawBtn" style="width:100%;padding:7px;border:1px solid #222;border-radius:7px;background:#fff;font-size:12px">SACAR</button>

        <button id="logoutBtn" type="button"
      style="width:100%;margin-top:10px;padding:8px;border:1px solid #222;border-radius:7px;background:#fff;font-size:12px">
      SAIR DA CONTA
    </button>
  </div>

  <div class="card">
    <h1>🦖 Dino Runner</h1>
        <div id="bankLabel" class="balance">R$ 0,00</div>

    <div class="actions">
      <button id="testBtn" class="mainbtn">JOGAR TESTE</button>
      <button id="paidBtn" class="mainbtn">JOGAR R$ 30,00</button>
      <button id="paid50Btn" class="mainbtn">JOGAR R$ 50,00</button>
      <button id="paid100Btn" class="mainbtn">JOGAR R$ 100,00</button>
    </div>
  </div>
</section>

<section id="game" class="hidden">
  <div id="top">
    <button id="exitBtn" disabled>RETIRAR 🔒 (mín. R$ 45,00)</button>
    <div id="roundInfo">
      Rodada: <span id="roundValue">R$ 0,00</span> • <span id="minimumText">mín. R$ 45,00</span>
    </div>
    <div id="scoreInfo">SCORE 00000</div>
  </div>

  <div id="wrap">
    <canvas id="canvas" width="1000" height="333"></canvas>
  </div>

  <div id="controls">
    <button id="jumpBtn">PULAR</button>
  </div>

  <div id="hint">Prévia: R$1/moeda → R$15 | R$30: R$0,50/moeda → R$45 | R$50: R$0,75/moeda → R$75 | R$100: R$1/moeda → R$150</div>
</section>

<script>
(() => {
  const loginScreen = document.getElementById("loginScreen");
  const loginUser = document.getElementById("loginUser");
  const loginPass = document.getElementById("loginPass");
  const loginEnter = document.getElementById("loginEnter");
  const loginCreate = document.getElementById("loginCreate");
  const loginMsg = document.getElementById("loginMsg");

  const ENTRY_COST = 30;
  const ENTRY_COST_50 = 50;
  const ENTRY_COST_100 = 100;
  const MIN_WITHDRAW_PAID = 45;
  const MIN_WITHDRAW_50 = 75;
  const MIN_WITHDRAW_100 = 150;
  const MIN_WITHDRAW_TEST = 15;
  const COIN_VALUE_PAID = 0.50;
  const COIN_VALUE_50 = 0.75;
  const COIN_VALUE_100 = 1.00;
  const COIN_VALUE_TEST = 1;

  const lobby = document.getElementById("lobby");
  const game = document.getElementById("game");
  const testBtn = document.getElementById("testBtn");
  const paidBtn = document.getElementById("paidBtn");
  const paid50Btn = document.getElementById("paid50Btn");
  const paid100Btn = document.getElementById("paid100Btn");
  const exitBtn = document.getElementById("exitBtn");
  const jumpBtn = document.getElementById("jumpBtn");
  const restartBtn = document.getElementById("restartBtn");
  const bankLabel = document.getElementById("bankLabel");
  const menuBank = document.getElementById("menuBank");
  const depositValue = document.getElementById("depositValue");
  const depositBtn = document.getElementById("depositBtn");
  const withdrawValue = document.getElementById("withdrawValue");
  const menuWithdrawBtn = document.getElementById("menuWithdrawBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const roundValue = document.getElementById("roundValue");
  const minimumText = document.getElementById("minimumText");
  const scoreInfo = document.getElementById("scoreInfo");
  const menuBtn = document.getElementById("menuBtn");
  const menu = document.getElementById("menu");

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Nova chave para esta versão começar limpa com R$100.
  let bank = 0;
  if (!Number.isFinite(bank)) bank = 0;

  let mode = "test"; // "test" ou "paid"
  let round = 0;
  let score = 0;
  let speed = 585;
  let elapsed = 0;
  let level = 0;
  let over = false;
  let last = performance.now();

  let dino = {};
  let obstacles = [];
  let coins = [];
  let obstacleTimer = 0;
  let coinTimer = 0;


  function demoUsers(){
    try { return JSON.parse(localStorage.getItem("dino_users_v5") || "{}"); }
    catch(e) { return {}; }
  }
  function credentials(){
    const u = loginUser.value.trim().toLowerCase();
    const p = loginPass.value;
    if(u.length < 3){ loginMsg.textContent="Usuário precisa ter pelo menos 3 caracteres."; return null; }
    if(p.length < 4){ loginMsg.textContent="Senha precisa ter pelo menos 4 caracteres."; return null; }
    return {u,p};
  }
  function enterLobby(){
    loginMsg.textContent="";
    loginScreen.classList.add("hidden");
    lobby.classList.remove("hidden");
    updateLobby();
  }
  function createAccount(){
    const c=credentials(); if(!c) return;
    const d=demoUsers();
    if(d[c.u]){ loginMsg.textContent="Esse usuário já existe."; return; }
    d[c.u]=c.p;
    localStorage.setItem("dino_users_v5",JSON.stringify(d));
    enterLobby();
  }
  function loginAccount(){
    const c=credentials(); if(!c) return;
    const d=demoUsers();
    if(!d[c.u]){ loginMsg.textContent="Conta não encontrada."; return; }
    if(d[c.u]!==c.p){ loginMsg.textContent="Senha incorreta."; return; }
    enterLobby();
  }

  function money(v){
    return "R$ " + v.toFixed(2).replace(".", ",");
  }

  function saveBank(){
    localStorage.setItem("dino_demo_bank_menu_test_v1", String(bank));
  }

  function updateLobby(){
    bankLabel.textContent = money(bank);
    menuBank.textContent = money(bank);
    paidBtn.disabled = false;
    paid50Btn.disabled = false;
    paid100Btn.disabled = false;
  }

  function goToDeposit(){
    menu.classList.remove("hidden");
    setTimeout(()=>{
      depositValue.focus();
      depositValue.scrollIntoView({behavior:"smooth",block:"center"});
    },50);
  }

  function updateRoundUI(){
    roundValue.textContent = money(round);
    const minimum = mode === "test" ? MIN_WITHDRAW_TEST : mode === "paid50" ? MIN_WITHDRAW_50 : mode === "paid100" ? MIN_WITHDRAW_100 : MIN_WITHDRAW_PAID;
    const unlocked = round >= minimum;

    exitBtn.disabled = !unlocked;
    exitBtn.textContent = unlocked
      ? "RETIRAR " + money(round)
      : "RETIRAR 🔒 (mín. " + money(minimum) + ")";

    minimumText.textContent = unlocked
      ? "RETIRADA LIBERADA ✓"
      : "mín. " + money(minimum);

    scoreInfo.textContent = "SCORE " + String(Math.floor(score)).padStart(5, "0");
  }

  function resetRound(){
    round = 0;
    score = 0;
    speed = 585;
    elapsed = 0;
    level = 0;
    over = false;
    obstacleTimer = 0.85;
    coinTimer = 0.9;
    dino = {x:95,y:236,w:54,h:56,vy:0,grounded:true};
    obstacles = [];
    coins = [];
    last = performance.now();
    updateRoundUI();
  }

  function showGame(){
    menu.classList.add("hidden");
    lobby.classList.add("hidden");
    game.classList.remove("hidden");
    resetRound();
  }

  function startTest(){
    mode = "test";
    showGame();
  }

  function startPaid(){
    if (bank < ENTRY_COST){ goToDeposit(); return; }

    mode = "paid";
    bank = Number((bank - ENTRY_COST).toFixed(2));
    saveBank();
    updateLobby();
    showGame();
  }

  function startPaid50(){
    if (bank < ENTRY_COST_50){ goToDeposit(); return; }
    mode = "paid50";
    bank = Number((bank - ENTRY_COST_50).toFixed(2));
    saveBank();
    updateLobby();
    showGame();
  }

  function startPaid100(){
    if (bank < ENTRY_COST_100){ goToDeposit(); return; }
    mode = "paid100";
    bank = Number((bank - ENTRY_COST_100).toFixed(2));
    saveBank();
    updateLobby();
    showGame();
  }

  function withdrawRound(){
    const required = mode === "test" ? MIN_WITHDRAW_TEST : mode === "paid50" ? MIN_WITHDRAW_50 : mode === "paid100" ? MIN_WITHDRAW_100 : MIN_WITHDRAW_PAID;
    if (round < required) return;

    const won = Number(round.toFixed(2));

    // Só a partida de R$30 altera a banca.
    if (mode !== "test") {
      bank = Number((bank + won).toFixed(2));
      saveBank();
    }

    // Zera a rodada ANTES de voltar.
    round = 0;
    updateRoundUI();

    game.classList.add("hidden");
    lobby.classList.remove("hidden");
    updateLobby();

    if (mode !== "test") {
      alert("Retirada teste: " + money(won) + ". Banca agora: " + money(bank) + ".");
    } else {
      alert("Partida teste encerrada. A banca não foi alterada.");
    }
  }

  function losePaidRound(){
    // Os R$30 já foram descontados ao entrar.
    round = 0;
    game.classList.add("hidden");
    lobby.classList.remove("hidden");
    updateLobby();
  }

  function jump(){
    if (over) return;
    if (dino.grounded){
      dino.vy = -770;
      dino.grounded = false;
    }
  }

  function hit(a,b){
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
  }

  function spawnObstacle(){
    const tall = Math.random() < .35;
    const h = tall ? 70 : 48 + Math.random()*16;
    const w = tall ? 34 : 32 + Math.random()*14;
    obstacles.push({x:1030,y:292-h,w,h});
  }

  function spawnCoin(){
    const high = Math.random() < .45;
    coins.push({x:1030,y:high?185:235,r:11,taken:false});
  }

  function update(dt){
    if (over) return;

    elapsed += dt;
    const newLevel = Math.floor(elapsed / (mode === "test" ? 10 : 2.5));
    if (newLevel !== level){
      level = newLevel;
      speed = 390 * (1.50 + level * (mode === "test" ? 0.05 : 0.08));
    }

    score += dt * 12;

    dino.vy += 2050 * dt;
    dino.y += dino.vy * dt;
    if (dino.y >= 236){
      dino.y = 236;
      dino.vy = 0;
      dino.grounded = true;
    }

    obstacleTimer -= dt;
    if (obstacleTimer <= 0){
      spawnObstacle();
      obstacleTimer = Math.max(.62, .95 + Math.random()*.9 - (speed-585)/2300);
    }

    coinTimer -= dt;
    if (coinTimer <= 0){
      spawnCoin();
      coinTimer = 1.0 + Math.random()*1.2;
    }

    obstacles.forEach(o => o.x -= speed*dt);
    coins.forEach(m => m.x -= speed*dt);

    obstacles = obstacles.filter(o => o.x + o.w > -30);
    coins = coins.filter(m => m.x + m.r > -30 && !m.taken);

    const dh = {x:dino.x+8,y:dino.y+7,w:dino.w-15,h:dino.h-10};

    for (const o of obstacles){
      if (hit(dh,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-5})){
        over = true;

        setTimeout(losePaidRound, 450);
        break;
      }
    }

    for (const m of coins){
      const mb = {x:m.x-m.r,y:m.y-m.r,w:m.r*2,h:m.r*2};
      if (hit(dh,mb)){
        m.taken = true;
        const coinValue = mode === "test" ? COIN_VALUE_TEST : mode === "paid50" ? COIN_VALUE_50 : mode === "paid100" ? COIN_VALUE_100 : COIN_VALUE_PAID;
        round = Number((round + coinValue).toFixed(2));
        score += 15;
        updateRoundUI();
      }
    }

    updateRoundUI();
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,333);
    g.addColorStop(0,"#dff3ff");
    g.addColorStop(1,"#fff4d6");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,1000,333);

    ctx.fillStyle="#ffd76a";
    ctx.beginPath();
    ctx.arc(850,62,32,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#c9d7cf";
    ctx.beginPath();
    ctx.moveTo(0,230);
    ctx.lineTo(130,120);
    ctx.lineTo(260,230);
    ctx.lineTo(390,145);
    ctx.lineTo(540,230);
    ctx.lineTo(710,135);
    ctx.lineTo(900,230);
    ctx.lineTo(1000,160);
    ctx.lineTo(1000,292);
    ctx.lineTo(0,292);
    ctx.fill();
  }

  function drawGround(){
    ctx.fillStyle="#e5c07b";
    ctx.fillRect(0,292,1000,41);
    ctx.fillStyle="#7b5b35";
    ctx.fillRect(0,292,1000,4);
  }

  function drawDino(){
    const x=dino.x,y=dino.y;
    ctx.fillStyle="#36a65d";
    ctx.beginPath();
    ctx.moveTo(x+7,y+30);
    ctx.lineTo(x-18,y+22);
    ctx.lineTo(x+3,y+42);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#3fbd68";
    ctx.fillRect(x+9,y+15,31,31);
    ctx.fillRect(x+22,y+3,27,29);
    ctx.fillRect(x+42,y+13,17,13);

    ctx.fillStyle="#9be08c";
    ctx.fillRect(x+17,y+29,17,13);

    ctx.fillStyle="#fff";
    ctx.fillRect(x+38,y+9,6,6);
    ctx.fillStyle="#111";
    ctx.fillRect(x+41,y+11,3,3);

    ctx.fillStyle="#2e8f4e";
    ctx.fillRect(x+14,y+44,8,12);
    ctx.fillRect(x+32,y+44,8,10);
  }

  function drawCactus(o){
    ctx.fillStyle="#2f8f57";
    ctx.fillRect(o.x+10,o.y,o.w-20,o.h);
    ctx.fillRect(o.x,o.y+22,10,8);
    ctx.fillRect(o.x,o.y+22,8,20);
    ctx.fillRect(o.x+o.w-10,o.y+31,10,8);
    ctx.fillRect(o.x+o.w-8,o.y+21,8,22);
  }

  function drawCoin(m){
    ctx.fillStyle="#f4b400";
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#ffd95a";
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.r-4,0,Math.PI*2);
    ctx.fill();
  }

  function draw(){
    if (game.classList.contains("hidden")) return;

    drawSky();
    drawGround();
    obstacles.forEach(drawCactus);
    coins.forEach(drawCoin);
    drawDino();

    if (over){
      ctx.fillStyle="rgba(255,255,255,.82)";
      ctx.fillRect(250,108,500,88);
      ctx.fillStyle="#222";
      ctx.textAlign="center";
      ctx.font="bold 38px Arial";
      ctx.fillText("GAME OVER",500,145);
      ctx.font="18px Arial";
      ctx.fillText(mode==="paid" ? "Voltando ao lobby..." : "Reinicie para tentar novamente",500,177);
    }
  }

  function loop(t){
    const dt = Math.min((t-last)/1000,.033);
    last = t;

    if (!game.classList.contains("hidden")){
      update(dt);
      draw();
    }

    requestAnimationFrame(loop);
  }

  loginCreate.addEventListener("click", createAccount);
  loginEnter.addEventListener("click", loginAccount);
  loginPass.addEventListener("keydown", e=>{ if(e.key==="Enter") loginAccount(); });

  testBtn.addEventListener("click", startTest);
  paidBtn.addEventListener("click", startPaid);
  paid50Btn.addEventListener("click", startPaid50);
  paid100Btn.addEventListener("click", startPaid100);
  exitBtn.addEventListener("click", withdrawRound);
  menuBtn.addEventListener("click",()=>menu.classList.toggle("hidden"));

  jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();jump()});

  window.addEventListener("keydown",e=>{
    if (game.classList.contains("hidden")) return;
    if (e.code==="Space" || e.code==="ArrowUp"){
      e.preventDefault();
      jump();
    }
  });

  logoutBtn.addEventListener("click",()=>{
    menu.classList.add("hidden");
    game.classList.add("hidden");
    lobby.classList.add("hidden");
    loginScreen.classList.remove("hidden");
    loginUser.value = "";
    loginPass.value = "";
    loginMsg.textContent = "";
  });

  depositBtn.addEventListener("click",()=>{
    const value = Number(depositValue.value);
    if(!Number.isFinite(value) || value < 25){
      alert("Depósito mínimo de demonstração: R$ 25,00.");
      return;
    }

    // O depósito não credita mais a banca automaticamente.
    // O saldo permanece inalterado nesta versão de demonstração.
    alert("Solicitação de depósito registrada. A banca não foi alterada.");
    depositValue.value = "";
    updateLobby();
  });

  menuWithdrawBtn.addEventListener("click",()=>{
    const value = Number(withdrawValue.value);
    if(!Number.isFinite(value) || value < 50){
      alert("Saque mínimo de demonstração: R$ 50,00.");
      return;
    }
    if(value > bank){
      alert("Saldo fictício insuficiente.");
      return;
    }
    bank = Number((bank - value).toFixed(2));
    saveBank();
    updateLobby();
    withdrawValue.value = "";
  });

  updateLobby();
  resetRound();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
